<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ऑनलाइन टेस्ट</title><style>body{margin:0;font-family:"Noto Sans Devanagari",system-ui,sans-serif;background:#eef2fb;color:#0f1b4d}h1{background:#12306b;color:#fff;margin:0;padding:1rem;font-size:1.2rem}main{max-width:620px;margin:auto;padding:.8rem}a,.x{display:block;background:#fff;border-radius:14px;padding:.9rem 1rem;margin:.5rem 0;text-decoration:none;color:#0f1b4d;font-weight:700;box-shadow:0 1px 6px rgba(15,27,77,.12)}a:after{content:" ▶";color:#2f6bff}.x{opacity:.55}</style></head><body><h1>ऑनलाइन टेस्ट</h1><main id="m">लोड हो रहा है…</main><script>fetch("tests.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){var m=document.getElementById("m");m.innerHTML="";(j.tests||[]).forEach(function(t){var e=document.createElement(t.locked?"div":"a");e.className=t.locked?"x":"";if(!t.locked)e.href=t.file;e.textContent=(t.locked?"🔒 ":"")+t.title+(t.locked?" — अभी बंद":"");m.appendChild(e)});if(!m.children.length)m.textContent="अभी कोई टेस्ट नहीं है।"}).catch(function(){document.getElementById("m").textContent="सूची लोड नहीं हो सकी।"})</script></body></html>
